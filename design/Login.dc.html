<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>BODY MUSE – Đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBD9CF;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#14110F}
a{color:#1A52B8}a:hover{color:#14110F}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1F5FD0;outline-offset:2px}
</style>
</helmet>
<div style="width:100%;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;background:#FBD9CF;min-height:820px">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 48px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#14110F">
<img src="/_blob/85b1797fa3e80457b6012732411ea728" alt="Huy hiệu BODY MUSE" style="width:48px;height:48px;border-radius:50%">
<span style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">BODY MUSE</span>
</a>
<a href="Shop.dc.html" style="font-weight:600;font-size:16px">Xem cửa hàng →</a>
</header>

<main style="flex:1;display:flex;flex-wrap:wrap;gap:56px;justify-content:center;align-items:flex-start;padding:16px 48px 64px">
<div style="flex:0 1 400px;aspect-ratio:3/4;border-radius:32px;border:3px solid #14110F;overflow:hidden;background:#F6C6BA">
<img src="/_blob/0d7b7d162d7b0e326b3e2f316363e530" alt="Lon xịt và chai sữa tắm BODY MUSE Daisy Blue trên nền hồng" style="width:100%;height:100%;object-fit:cover;display:block">
</div>
<div style="flex:1 1 420px;max-width:520px;background:#FFF6EE;border:3px solid #14110F;border-radius:32px;padding:40px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-family:'Fraunces',serif;font-weight:800;font-size:40px;line-height:1.1">Đăng nhập</h1>
<p style="margin:0;font-size:16px;line-height:1.5">Chỉ cần số điện thoại và mật khẩu.</p>
</div>
<sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" style="display:flex;flex-direction:column;gap:18px" novalidate>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="phone" style="font-weight:600;font-size:15px">Số điện thoại</label>
<div style="position:relative">
<input id="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="Ví dụ: 0901234567" aria-describedby="phone-err" style="{{pStyle}}">

</div>
<sc-if value="{{pHas}}"><span id="phone-err" role="alert" style="font-size:14px;font-weight:600;color:#B42318">{{pMsg}}</span></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="password" style="font-weight:600;font-size:15px">Mật khẩu</label>
<div style="position:relative">
<input id="password" type="{{pwType}}" autocomplete="current-password" placeholder="Nhập mật khẩu" aria-describedby="password-err" style="{{wStyle}}">
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="position:absolute;right:8px;top:8px;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:#F4EFEA;color:#14110F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer">{{toggleText}}</button>
</div>
<sc-if value="{{wHas}}"><span id="password-err" role="alert" style="font-size:14px;font-weight:600;color:#B42318">{{wMsg}}</span></sc-if>
</div>
<a href="Forgot.dc.html" style="align-self:flex-end;font-weight:600;font-size:15px">Quên mật khẩu?</a>
<button type="submit" style="display:flex;align-items:center;justify-content:center;min-height:56px;border:2px solid #14110F;border-radius:999px;background:#14110F;color:#FFF6EE;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;width:100%">Đăng nhập</button>
</form>
<span style="font-size:16px;text-align:center">Chưa có tài khoản? <a href="Register.dc.html" style="font-weight:700">Đăng ký</a></span>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:16px">
<div role="status" style="background:#BFE5D3;border:2px solid #14110F;border-radius:20px;padding:20px;font-size:17px;line-height:1.5"><b>Đăng nhập thành công.</b><br>Xin chào, số {{shownPhone}}.</div>
<a href="Shop.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:56px;border:2px solid #14110F;border-radius:999px;background:#14110F;color:#FFF6EE;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;text-decoration:none">Vào cửa hàng</a>
</div>
</sc-if>
<span style="font-size:13px;color:#4A413C">Bản demo cho đồ án, không thu tiền thật.</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { show: false, done: false, phone: '', e: {} }; }
  renderVals() {
    const st = this.state;
    const base = 'min-height:56px;padding:0 18px;border:2px solid #14110F;border-radius:16px;font-size:17px;font-family:inherit;background:#fff;color:#14110F;width:100%;box-sizing:border-box;';
    const sty = (bad) => base + (bad ? 'border-color:#B42318;border-width:3px;' : '');
    const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const phoneOk = (s) => /^0\d{9}$/.test(s.replace(/[\s.-]/g, ''));
    const pwOk = (s) => s.length >= 8 && /[A-Za-z]/.test(s) && /\d/.test(s);
    return {
      isForm: !st.done, isDone: st.done, shownPhone: st.phone,
      pwType: st.show ? 'text' : 'password',
      toggleText: st.show ? 'Ẩn' : 'Hiện',
      toggleLabel: st.show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu',
      toggle: () => this.setState({ show: !st.show }),
      pStyle: sty(!!st.e.p), pHas: !!st.e.p, pMsg: st.e.p || '',
      wStyle: sty(!!st.e.w), wHas: !!st.e.w, wMsg: st.e.w || '',
      submit: (ev) => {
        if (ev && ev.preventDefault) ev.preventDefault();
        const p = val('phone').replace(/[\s.-]/g, ''), w = val('password');
        const e = {};
        if (!phoneOk(p)) e.p = 'Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.';
        if (!w) e.w = 'Bạn chưa nhập mật khẩu.';
        else if (w.length < 8) e.w = 'Mật khẩu hoặc số điện thoại chưa đúng.';
        if (Object.keys(e).length) this.setState({ e: e });
        else this.setState({ e: {}, done: true, phone: p });
      }
    };
  }
}
</script>
</body>
</html>
